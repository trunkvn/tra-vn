<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 840 760" fill="none" stroke="#c3d98c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<style>
.wisp { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: wisp 8s ease-in-out infinite; }
.w1 { animation-delay: -1.5s; }
.w2 { animation-duration: 9.4s; animation-delay: -5s; }
.w3 { animation-duration: 7s; animation-delay: -3s; }
@keyframes wisp {
  0%   { opacity: 0;   transform: translate(0px,26px) skewX(0deg) scale(.92,.86); }
  22%  { opacity: .9;  transform: translate(2px,10px) skewX(3deg) scale(.97,.95); }
  50%  { opacity: .7;  transform: translate(-3px,-8px) skewX(-4deg) scale(1,1); }
  78%  { opacity: .3;  transform: translate(5px,-24px) skewX(4deg) scale(1.04,1.06); }
  100% { opacity: 0;   transform: translate(-4px,-40px) skewX(-3deg) scale(1.08,1.1); }
}
.lid { animation: lid 7s ease-in-out infinite; }
@keyframes lid {
  0%,100% { transform: translateY(0px); }
  45% { transform: translateY(-2.5px); }
  60% { transform: translateY(-1px); }
}
.leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 9s ease-in-out infinite; }
@keyframes sway {
  0%,100% { transform: rotate(-1.2deg) scale(1); }
  50% { transform: rotate(1.2deg) scale(1.015); }
}
.march { animation: march 24s linear infinite; }
.march2 { animation: march 30s linear infinite reverse; }
@keyframes march { to { stroke-dashoffset: -100; } }
@media (prefers-reduced-motion: reduce) {
  .wisp { animation: none; opacity: .6; }
  .lid, .leaf, .march, .march2 { animation: none; }
}
</style>
<g transform="translate(20 130)">
