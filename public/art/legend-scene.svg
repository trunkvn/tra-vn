<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -64 1200 484" fill="none" stroke="#c3d98c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<style>
.wisp { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: wisp 7s ease-in-out infinite; }
.w1 { animation-duration: 7s; animation-delay: -1s; }
.w2 { animation-duration: 8.5s; animation-delay: -4s; }
.w3 { animation-duration: 6.4s; animation-delay: -2.4s; }
.w4 { animation-duration: 9s; animation-delay: -6s; }
.w5 { animation-duration: 7.6s; animation-delay: -3.2s; }
@keyframes wisp {
  0%   { opacity: 0;   transform: translate(0px,28px) skewX(0deg) scale(.92,.86); }
  22%  { opacity: .85; transform: translate(2px,10px) skewX(3deg) scale(.97,.95); }
  50%  { opacity: .7;  transform: translate(-3px,-8px) skewX(-4deg) scale(1,1); }
  78%  { opacity: .3;  transform: translate(5px,-24px) skewX(4deg) scale(1.04,1.06); }
  100% { opacity: 0;   transform: translate(-4px,-40px) skewX(-3deg) scale(1.08,1.1); }
}
.drift { opacity: 0; animation: fall 10s linear infinite; }
.d1 { animation-delay: 0s; }
.d2 { animation-delay: -3.4s; }
.d3 { animation-delay: -6.8s; }
@keyframes fall {
  0.0% { transform: translate(450px,78px) rotate(15deg) scale(1); opacity: 0; }
  10.0% { transform: translate(489px,88px) rotate(39deg) scale(1); opacity: 1; }
  20.0% { transform: translate(521px,105px) rotate(30deg) scale(1); opacity: 1; }
  30.0% { transform: translate(547px,128px) rotate(30deg) scale(1); opacity: 1; }
  40.0% { transform: translate(568px,156px) rotate(67deg) scale(1); opacity: 1; }
  50.0% { transform: translate(585px,190px) rotate(69deg) scale(1); opacity: 1; }
  60.0% { transform: translate(607px,212px) rotate(21deg) scale(1); opacity: 1; }
  70.0% { transform: translate(642px,228px) rotate(6deg) scale(1); opacity: 1; }
  80.0% { transform: translate(686px,236px) rotate(22deg) scale(1); opacity: 1; }
  90.0% { transform: translate(737px,238px) rotate(5deg) scale(1); opacity: 1; }
  100.0% { transform: translate(790px,232px) rotate(-24deg) scale(1); opacity: 0; }
}
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; }
.f2 { animation-duration: 1.3s; animation-delay: -.5s; }
.f3 { animation-duration: 1.9s; animation-delay: -1.1s; }
@keyframes flicker {
  0%,100% { transform: scale(1,1) skewX(0deg); opacity: .6; }
  30% { transform: scale(.92,1.14) skewX(3deg); opacity: .85; }
  65% { transform: scale(1.06,.9) skewX(-3deg); opacity: .5; }
}
.ripple { transform-box: fill-box; transform-origin: 50% 50%; animation: ripple 4.4s ease-out infinite; }
.r2 { animation-delay: -2.2s; }
@keyframes ripple {
  0%   { transform: scale(.55,.55); opacity: .8; }
  100% { transform: scale(1.5,1.5); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .wisp { animation: none; opacity: .7; }
  .drift { animation: none; opacity: 0; }
  .flame, .ripple { animation: none; }
}
</style>
