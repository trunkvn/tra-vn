<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -50 1000 570" fill="none" stroke="#c3d98c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<style>
.sway { transform-origin: 250px 146px; animation: sway 7s ease-in-out infinite; }
@keyframes sway {
  0%,100% { transform: rotate(-0.5deg); }
  50% { transform: rotate(0.5deg); }
}
.stream { animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { opacity: .8; }
  50% { opacity: 1; }
}
.flow { stroke-dasharray: 5 15; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.surface { transform-box: fill-box; transform-origin: 50% 50%; animation: slosh 3.6s ease-in-out infinite; }
@keyframes slosh {
  0%,100% { transform: scale(1,1); }
  50% { transform: scale(1.05,1.18); }
}
.ripple { transform-box: fill-box; transform-origin: 50% 50%; animation: ripple 3.2s ease-out infinite; }
.r2 { animation-delay: -1.6s; }
@keyframes ripple {
  0%   { transform: scale(.45,.45); opacity: .85; }
  100% { transform: scale(1.35,1.35); opacity: 0; }
}
.wisp { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: wisp 7s ease-in-out infinite; }
.w1 { animation-duration: 7s;   animation-delay: -1s; }
.w2 { animation-duration: 8.4s; animation-delay: -4.2s; }
.w3 { animation-duration: 6.2s; animation-delay: -2.6s; }
.w4 { animation-duration: 9.2s; animation-delay: -5.6s; }
.w5 { animation-duration: 8s;   animation-delay: -0.4s; }
@keyframes wisp {
  0%   { opacity: 0;   transform: translate(0px,24px) skewX(0deg) scale(.92,.86); }
  22%  { opacity: .9;  transform: translate(2px,9px) skewX(3deg) scale(.97,.95); }
  50%  { opacity: .7;  transform: translate(-3px,-7px) skewX(-4deg) scale(1,1); }
  78%  { opacity: .3;  transform: translate(5px,-20px) skewX(4deg) scale(1.04,1.06); }
  100% { opacity: 0;   transform: translate(-4px,-34px) skewX(-3deg) scale(1.08,1.1); }
}
@media (prefers-reduced-motion: reduce) {
  .sway, .stream, .flow, .surface, .ripple { animation: none; }
  .flow { stroke-dasharray: none; opacity: 0; }
  .wisp { animation: none; opacity: .5; }
}
</style>
