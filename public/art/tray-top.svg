<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" stroke="#c3d98c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<style>
.ring { transform-origin: 300px 300px; animation: turn 140s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.tea { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 4.6s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { transform: scale(.9); opacity: .35; }
  50% { transform: scale(1.12); opacity: .75; }
}
.lidsteam { transform-box: fill-box; transform-origin: 50% 100%; animation: lid 6s ease-in-out infinite; }
@keyframes lid {
  0%,100% { opacity: .15; transform: translateY(2px) scale(.96,.92); }
  50% { opacity: .55; transform: translateY(-5px) scale(1.04,1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .tea, .lidsteam { animation: none; }
  .tea { opacity: .5; }
}
</style>
