<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 420 183" fill="none" stroke="#c3d98c" stroke-width="7" stroke-linecap="round">
<style>
.bob { animation: bob 8s ease-in-out infinite; }
@keyframes bob {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
}
.base { opacity: .38; }
.flowline { stroke-dasharray: 20 80; animation: run 7s linear infinite; }
@keyframes run {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -100; }
}
.drift { animation: drift 6s ease-in-out infinite; }
.d2 { animation-duration: 8.4s; animation-delay: -3s; }
@keyframes drift {
  0%,100% { transform: translateX(-9px); opacity: .7; }
  50% { transform: translateX(9px); opacity: .32; }
}
@media (prefers-reduced-motion: reduce) {
  .bob, .drift { animation: none; }
  .base { opacity: 1; }
  .flowline { display: none; }
}
</style>
<g class="bob">
<path class="base" d="M20 124C70 124 74 70 128 70C176 70 168 112 214 112C262 112 262 40 322 40C372 40 380 86 346 96C320 103 306 78 328 68"/>
<path class="flowline" pathLength="100" d="M20 124C70 124 74 70 128 70C176 70 168 112 214 112C262 112 262 40 322 40C372 40 380 86 346 96C320 103 306 78 328 68"/>
<path class="drift" d="M60 144C100 144 108 112 150 112" stroke-width="5" opacity=".7"/>
<path class="drift d2" d="M250 138C290 138 296 116 332 116" stroke-width="5" opacity=".7"/>
</g>
</svg>
